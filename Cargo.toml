[package]
name = "maxx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Atelier visuel qui dessine des vues GPUI et les écrit en Rust"
repository = "https://github.com/nseaSeb/maxx"
readme = "README.md"
keywords = ["gpui", "gui", "designer", "codegen"]
categories = ["development-tools", "gui"]
# Les chaînes `&& let` (actions.rs, workspace.rs) demandent 1.88 ; l'édition
# 2024 seule laisserait croire à 1.85.
rust-version = "1.88"
# La démo se construit seule, et publier maxx n'est pas l'objectif du moment.
publish = false

[dependencies]
# runtime_shaders avoids the build-time `metal` compiler, which Xcode 26 ships
# as a separate downloadable component. Do not remove it on this machine.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# tree-sitter-languages is what the code reader reads with: without it the
# crate's `Language` enum holds Json alone, and every file — Rust included —
# would be coloured with the JSON grammar. It costs the ~29 bundled grammars at
# build time, and adds no third-party dependency of our own.
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
syn = { version = "3", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# Déjà compilés dans l'arbre par gpui : les prendre en dépendance directe ne
# coûte rien de plus au build.
serde = { version = "1", features = ["derive"] }
toml = "0.8"                 # lecture unique de l'ancien settings.toml
serde_json_lenient = "0.2"   # le JSON à commentaires, celui que Zed lit
schemars = "1"
# Déjà dans l'arbre : gpui-component y met ses propres chaînes, et
# `set_locale` y écrit le même global que celui-ci. Le prendre en dépendance
# directe ne coûte donc rien au build.
rust-i18n = "3"
# Déjà dans l'arbre en 0.25 par gpui, qui décode les images avec : `image_dimensions`
# n'en lit que l'en-tête, et c'est ce qui permet de dire à l'inspecteur combien
# de pixels fait vraiment la photographie qu'on vient de poser.
image = "0.25"

[dev-dependencies]
# Déjà dans l'arbre par gpui : sert à rasteriser les essais d'icône.
resvg = "0.45"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# Le profil de la CI, et la raison d'être de chaque ligne.
#
# `[profile.dev.package."*"]` compile les 750 crates de dépendances en O2 pour
# que l'interface soit fluide pendant le développement. La CI n'ouvre aucune
# fenêtre : elle paie cette optimisation sans jamais en profiter, et c'est la
# part dominante de son temps. Ici, les dépendances repassent en O0.
#
# Et pas d'informations de débogage : personne ne pose de point d'arrêt dans un
# runner, alors que leur écriture — les PDB sur Windows — pèse lourd à l'édition
# de liens, répétée pour chacun des binaires de test.
[profile.ci]
inherits = "test"
debug = false

[profile.ci.package."*"]
opt-level = 0
debug = false
