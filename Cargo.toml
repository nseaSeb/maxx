[package]
name = "maxx"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A visual workshop that builds GPUI views and writes them out as real Rust source"
repository = "https://github.com/nseaSeb/maxx"
readme = "README.md"
keywords = ["gpui", "gui", "designer", "codegen"]
categories = ["development-tools", "gui"]
# The `&& let` chains (actions.rs, workspace.rs) need 1.88; edition 2024 alone
# would suggest 1.85.
rust-version = "1.88"
# What the crates.io package leaves behind: the README's media, four megabytes
# on their own, which nobody downloads when installing maxx. crates.io resolves
# the README's relative links against `repository`, so the images keep showing
# — from GitHub. `assets/icon.svg` and the two small PNGs stay: the icon's
# source is correctable, and `cargo run --example make_icon` reads it back.
exclude = ["docs/", "assets/maxx.icns"]

[dependencies]
# runtime_shaders avoids the build-time `metal` compiler, which Xcode 26 ships
# as a separate downloadable component. Do not remove it on this machine.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
# tree-sitter-languages is what the code reader reads with: without it the
# crate's `Language` enum holds Json alone, and every file — Rust included —
# would be coloured with the JSON grammar. It costs the ~29 bundled grammars at
# build time, and adds no third-party dependency of our own.
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
syn = { version = "3", features = ["full", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
# Already compiled in the tree by gpui: taking them as direct dependencies
# costs the build nothing more.
serde = { version = "1", features = ["derive"] }
toml = "0.8"                 # one-off read of the old settings.toml
serde_json_lenient = "0.2"   # JSON with comments, the kind Zed reads
schemars = "1"
# Already in the tree: gpui-component puts its own strings there, and
# `set_locale` writes the same global as this one does. Taking it as a direct
# dependency therefore costs the build nothing.
rust-i18n = "3"
# Already in the tree at 0.25 through gpui, which decodes images with it:
# `image_dimensions` reads only the header, and that is what lets the inspector
# say how many pixels the photograph just dropped really has.
image = "0.25"
# Already in the tree through gpui-component: taking it as a direct dependency
# costs the build nothing more. It is what tells maxx an editor has just
# written into the open project.
notify = "7"
# Already in the tree through gpui, which builds its whole executor on it. What
# we take from it is one thing: a channel that can be awaited, so that watching
# the project does not wake the window ten times a second to do nothing.
futures = "0.3"

[dev-dependencies]
proptest = "1.11.0"
# Already in the tree through gpui: used to rasterise the icon drafts.
resvg = "0.45"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

# The CI's profile, and the reason for each line.
#
# `[profile.dev.package."*"]` compiles the 750 dependency crates at O2 so the
# interface is smooth during development. The CI opens no window: it pays for
# that optimisation without ever benefiting from it, and that is the dominant
# part of its time. Here, the dependencies go back to O0.
#
# And no debug information: nobody sets a breakpoint in a runner, while writing
# it — the PDBs on Windows — weighs heavily at link time, repeated for each of
# the test binaries.
[profile.ci]
inherits = "test"
debug = false

[profile.ci.package."*"]
opt-level = 0
debug = false
