# Une seule dérogation aux réglages par défaut.
#
# `Max` laisse une expression courte tenir sur sa ligne au lieu de l'éclater en
# une ligne par élément. C'est ce qui préserve les tables du catalogue, dans
# `registry.rs` — le fichier qu'on invite les autres à étendre, et celui où
# lire une liste de styles à raison d'un mot par ligne serait une punition.
#
# La démo a son propre rustfmt.toml, vide : elle doit être mise en forme comme
# un projet généré ailleurs, donc au rustfmt par défaut, et ce fichier-ci ne la
# concerne pas.
use_small_heuristics = "Max"
