# One single departure from the defaults.
#
# `Max` lets a short expression stay on its own line instead of exploding into
# one line per element. That is what keeps the catalogue tables readable in
# `registry/catalogue.rs` — the file others are invited to extend, and the one
# where reading a list of styles at one word per line would be a punishment.
#
# The demo has its own rustfmt.toml, empty: it has to be formatted like a
# project generated anywhere else, so with plain default rustfmt, and this file
# does not concern it.
use_small_heuristics = "Max"
