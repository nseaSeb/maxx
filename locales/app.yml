  en: "Format on save"
  fr: "Mettre en forme à l'enregistrement"
prefs.format_on_save_desc:
  en: "Runs rustfmt on the file after every write, so that what maxx writes follows the project's conventions — its rustfmt.toml included. Careful: rustfmt formats the whole file, not only the region maxx manages. On an already formatted project, that changes nothing elsewhere."
  fr: "Passe rustfmt sur le fichier après chaque écriture, pour que ce que maxx écrit suive les conventions du projet — son rustfmt.toml compris. Attention : rustfmt met en forme le fichier entier, pas seulement la zone que maxx gère. Sur un projet déjà formaté, cela ne change rien ailleurs."
prefs.installed_only:
  en: "Only what is installed is offered."
  fr: "Seul ce qui est installé est proposé."
prefs.installed_only_bound:
  en: "Only what is installed is offered. A terminal editor — Helix, Neovim, Vim — is launched in the terminal chosen below, which therefore has to know how to receive a command."
  fr: "Seul ce qui est installé est proposé. Un éditeur de terminal — Helix, Neovim, Vim — est lancé dans le terminal choisi ci-dessous, qui doit donc savoir recevoir une commande."
prefs.language:
  en: "Language"
  fr: "Langue"
prefs.language_desc:
  en: "What maxx speaks. “System” follows what the system reports and falls back to English; anything maxx has not translated shows in English."
  fr: "Ce que maxx parle. « Système » suit ce que le système annonce et retombe sur l'anglais ; ce que maxx n'a pas traduit s'affiche en anglais."
