# The release gate: what has to be true before a version goes out.
#
# The ordinary CI gives a fast signal on macOS at every push. This one is the
# opposite: rare, complete, and unforgiving. It starts on a `v*` tag, and on
# demand when you want a dry run before tagging.
#
# One remark worth making: a tag is the worst place to *discover* a breakage,
# since the commit is already the one you meant to publish. This gate therefore
# does not replace the weekly net, it doubles it at the moment an error costs
# the most.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libvulkan-dev \
            pkg-config \
            cmake \
            clang

      - name: Keep Defender out of the build directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      - uses: Swatinem/rust-cache@v2

      # Compiles nothing: this is the cheapest check of them all, and it keeps a
      # contributor's `cargo fmt` from drowning their real change in a
      # whole-file reformat.
      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # What the ordinary CI never does: build in release. An optimisation can
      # reveal what a debug build tolerates.
      - name: Build
        run: cargo build --release

  package:
    name: the package holds together
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo package --list` says what would go out on crates.io. Two traps it
      # catches: a forgotten file, and above all `Cargo.lock`, which `build.rs`
      # reads to learn gpui's version — without it, the version the "About"
      # window shows would become "unknown".
      - name: What would go out
        run: |
          set -euo pipefail
          cargo package --list --allow-dirty > package.txt
          cat package.txt
          grep -qx "build.rs" package.txt || { echo "build.rs is missing from the package"; exit 1; }
          grep -qx "Cargo.lock" package.txt || {
            echo "Cargo.lock is missing: build.rs could no longer read gpui's version"
            exit 1
          }
          grep -q "^demo/" package.txt && { echo "the demo has no business in the package"; exit 1; }
          exit 0

  publish:
    name: open the release
    needs: [verify, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # No binary is attached, and that is deliberate: maxx addresses people who
      # compile. An executable attached here would be a distribution in the
      # licensing sense — Apache-2.0 for gpui, MPL-2.0 for option-ext — with the
      # notices that have to travel with it. Publishing the source demands none
      # of them, and `cargo install` is enough for anyone with a toolchain.
      #
      # Through the `gh` client rather than a third-party action: every
      # third-party action is one more surface on a public repository.
      - name: Open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent, and not out of politeness: a tag moved onto another
          # commit re-runs this job, and `gh release create` fails on a release
          # that already exists. The release follows the tag's name, so it shows
          # the new commit without anyone touching it.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, and follows the tag."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
