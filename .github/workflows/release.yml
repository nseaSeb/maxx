# Le portail de publication : ce qui doit être vrai avant qu'une version sorte.
#
# La CI ordinaire donne un signal rapide sur macOS à chaque poussée. Celle-ci
# est l'inverse : rare, complète, et sans indulgence. Elle part sur un tag
# `v*`, et sur demande quand on veut la passer à blanc avant d'étiqueter.
#
# Une remarque qui vaut d'être dite : un tag est le pire endroit pour
# *découvrir* une casse, puisque le commit est déjà celui qu'on voulait
# publier. Ce portail ne remplace donc pas le filet hebdomadaire, il le double
# au moment où l'erreur coûte le plus cher.

name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  verifier:
    name: ${{ matrix.systeme }}
    runs-on: ${{ matrix.systeme }}
    strategy:
      fail-fast: false
      matrix:
        systeme: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libvulkan-dev \
            pkg-config \
            cmake \
            clang

      - name: Écarter Defender du répertoire de compilation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      - uses: Swatinem/rust-cache@v2

      # Ne compile rien : c'est la vérification la moins chère de toutes, et
      # elle évite qu'un `cargo fmt` de contributeur noie son vrai changement
      # dans un reformatage de fichier entier.
      - name: Mise en forme
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # Ce que la CI ordinaire ne fait jamais : construire en release. Une
      # optimisation peut révéler ce qu'un build de debug tolère.
      - name: Construction
        run: cargo build --release

  paquet:
    name: le paquet se tient
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo package --list` dit ce qui partirait sur crates.io. Deux pièges
      # qu'il attrape : un fichier oublié, et surtout `Cargo.lock`, que
      # `build.rs` lit pour connaître la version de gpui — sans lui, la version
      # affichée par la fenêtre « À propos » deviendrait « inconnue ».
      - name: Ce qui partirait
        run: |
          set -euo pipefail
          cargo package --list --allow-dirty > paquet.txt
          cat paquet.txt
          grep -qx "build.rs" paquet.txt || { echo "build.rs manque au paquet"; exit 1; }
          grep -qx "Cargo.lock" paquet.txt || {
            echo "Cargo.lock manque : build.rs ne saurait plus lire la version de gpui"
            exit 1
          }
          grep -q "^demo/" paquet.txt && { echo "la démo n'a rien à faire dans le paquet"; exit 1; }
          exit 0

  publier:
    name: ouvrir la version
    needs: [verifier, paquet]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Aucun binaire n'est attaché, et c'est délibéré : maxx s'adresse à des
      # gens qui compilent. Un exécutable joint ici serait une distribution au
      # sens des licences — Apache-2.0 pour gpui, MPL-2.0 pour option-ext —
      # avec les mentions à faire voyager avec lui. Publier la source n'en
      # demande aucune, et `cargo install` suffit à qui a de quoi construire.
      #
      # Par le client `gh` plutôt qu'une action tierce : chaque action tierce
      # est une surface de plus sur un dépôt public.
      - name: Ouvrir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent, et ce n'est pas de la politesse : un tag redéposé sur un
          # autre commit relance ce travail, et `gh release create` échoue sur
          # une version qui existe déjà. La version suit le nom du tag, donc
          # elle montre le nouveau commit sans qu'on la touche.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "La version ${GITHUB_REF_NAME} existe déjà, et suit le tag."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
