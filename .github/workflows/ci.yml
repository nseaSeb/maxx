# Ce que cette CI prouve, et ce qu'elle ne prouve pas.
#
# Elle prouve que maxx compile et que sa suite passe. Rien dans maxx n'est
# propre à macOS, mais il est écrit sur un Mac, et une ligne comme
# `std::os::unix::process::CommandExt` suffit à casser Windows sans que
# personne le voie.
#
# Elle ne prouve pas que l'interface est utilisable. Aucun test n'ouvre de
# fenêtre — ils portent sur le modèle, le parseur, les gabarits et les
# réglages. Il faut qu'un humain lance maxx une fois par système.
#
# Ce qu'elle coûte. Sur un dépôt public, les runners standard sont gratuits et
# illimités : les trois systèmes tournent donc à chaque poussée, et le filet
# sert enfin à chaque fois qu'il pourrait attraper quelque chose.
#
# Tant que le dépôt était privé, ce n'était pas tenable — les minutes y sont
# comptées avec des multiplicateurs, ×1 sur Linux, ×2 sur Windows et ×10 sur
# macOS, si bien qu'un seul run complet à froid coûtait près de 400 minutes
# facturées sur un quota mensuel de 2 000. D'où le dosage qui a précédé, et qui
# n'a plus lieu d'être. Si le dépôt redevenait privé, il faudrait le remettre.
#
# Reste vrai : une poussée qui ne touche que de la documentation ne lance rien.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  workflow_dispatch:
  schedule:
    # Gardé même si chaque poussée vérifie tout : il attrape ce qui casse sans
    # qu'on ait rien changé — une mise à jour de runner, un outil qui bouge.
    - cron: "0 6 * * 1"

# Une poussée qui en remplace une autre annule celle d'avant : sur une branche
# où l'on pousse plusieurs fois d'affilée, c'est là qu'est le vrai gain. Jamais
# sur `main`, pour ne pas perdre un résultat qu'on attend.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verifier:
    name: ${{ matrix.systeme }}
    runs-on: ${{ matrix.systeme }}
    strategy:
      fail-fast: false
      matrix:
        systeme: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # gpui dessine avec Vulkan sur Linux et parle à Wayland comme à X11 ; ses
      # crates de fontes veulent fontconfig. Sans ces paquets, la compilation
      # échoue sur des en-têtes C introuvables, pas sur du Rust.
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libvulkan-dev \
            pkg-config \
            cmake \
            clang

      # Defender inspecte chaque fichier que le compilateur écrit, et rustc en
      # écrit des dizaines de milliers. C'est la première cause de lenteur des
      # runners Windows, et une exclusion la fait tomber.
      - name: Écarter Defender du répertoire de compilation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      - uses: Swatinem/rust-cache@v2

      # Pas de `cargo check` séparé : clippy fait le même travail. Mesuré sur le
      # premier run Windows, `check` puis `clippy` coûtaient 18 min et 16 s —
      # clippy ne payait rien parce que check avait tout préparé. Le retirer ne
      # gagne donc presque rien : c'est `cargo test` qui coûte, parce que lui
      # doit produire du code machine là où les deux autres s'arrêtent aux
      # métadonnées.
      # Ne compile rien : c'est la vérification la moins chère de toutes, et
      # elle évite qu'un `cargo fmt` de contributeur noie son vrai changement
      # dans un reformatage de fichier entier.
      - name: Mise en forme
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Le profil `ci` : dépendances en O0 et pas d'informations de débogage.
      # La CI n'ouvre aucune fenêtre, elle n'a donc rien à gagner à optimiser
      # 750 crates, et personne n'y pose de point d'arrêt.
      - name: Tests
        run: cargo test --profile ci

  demo:
    name: la démo compile
    runs-on: macos-latest
    # Le filtre par fichier touché a été retiré : `github.event.commits.*.modified`
    # est un tableau de tableaux, et le `join` par-dessus ne donne pas ce qu'on
    # croit — la démo a été sautée sur une poussée qui modifiait pourtant
    # src/scaffold.rs. Un travail qui se saute quand il devrait tourner est pire
    # qu'un travail qui tourne pour rien, surtout à deux minutes avec le cache.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo
      # La démo n'est pas membre de l'espace de travail : rien ne la construit
      # sans commande explicite. Elle est pourtant la preuve que ce que maxx
      # écrit compile encore.
      - name: Compilation de la démo
        working-directory: demo
        run: cargo check
