# Ce que cette CI prouve, et ce qu'elle ne prouve pas.
#
# Elle prouve que maxx compile et que sa suite passe. Rien dans maxx n'est
# propre à macOS, mais il est écrit sur un Mac, et une ligne comme
# `std::os::unix::process::CommandExt` suffit à casser Windows sans que
# personne le voie.
#
# Elle ne prouve pas que l'interface est utilisable. Aucun test n'ouvre de
# fenêtre — ils portent sur le modèle, le parseur, les gabarits et les
# réglages. Il faut qu'un humain lance maxx une fois par système.
#
# Ce qu'elle coûte, et comment c'est tenu. gpui et gpui-component représentent
# environ 750 crates : à froid, une branche de la matrice dure une dizaine de
# minutes, et Windows le double. D'où trois décisions :
#
#   - une poussée ne lance que macOS, la plateforme de développement, qui donne
#     le signal utile en quelques minutes ;
#   - les trois systèmes tournent sur demande, sur les pull requests, et une
#     fois par semaine — c'est là que sert le filet, pas à chaque virgule ;
#   - une poussée qui ne touche que de la documentation ne lance rien.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  workflow_dispatch:
  schedule:
    # Lundi matin : le retard de portabilité se voit en début de semaine, pas
    # au moment de publier.
    - cron: "0 6 * * 1"

# Une poussée qui en remplace une autre annule celle d'avant : sur une branche
# où l'on pousse plusieurs fois d'affilée, c'est là qu'est le vrai gain. Jamais
# sur `main`, pour ne pas perdre un résultat qu'on attend.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verifier:
    name: ${{ matrix.systeme }}
    runs-on: ${{ matrix.systeme }}
    strategy:
      fail-fast: false
      matrix:
        # Une poussée ordinaire ne vérifie que macOS ; les trois systèmes sont
        # pour les pull requests, la demande explicite et le rendez-vous
        # hebdomadaire.
        systeme: ${{ fromJSON(github.event_name == 'push' && '["macos-latest"]' || '["macos-latest", "ubuntu-latest", "windows-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # gpui dessine avec Vulkan sur Linux et parle à Wayland comme à X11 ; ses
      # crates de fontes veulent fontconfig. Sans ces paquets, la compilation
      # échoue sur des en-têtes C introuvables, pas sur du Rust.
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libvulkan-dev \
            pkg-config \
            cmake \
            clang

      - uses: Swatinem/rust-cache@v2

      # Pas de `cargo check` séparé : clippy compile tout ce que check aurait
      # compilé, et le faire deux fois double la partie la plus longue.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  demo:
    name: la démo compile
    runs-on: macos-latest
    # La démo ne bouge que quand les gabarits ou elle-même bougent : la
    # reconstruire à chaque poussée coûterait 750 crates pour rien.
    if: >-
      github.event_name != 'push' ||
      contains(join(github.event.commits.*.modified, ','), 'demo/') ||
      contains(join(github.event.commits.*.added, ','), 'demo/') ||
      contains(join(github.event.commits.*.modified, ','), 'src/scaffold.rs') ||
      contains(join(github.event.commits.*.modified, ','), 'src/codegen.rs') ||
      contains(join(github.event.commits.*.modified, ','), 'src/parser.rs')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo
      # La démo n'est pas membre de l'espace de travail : rien ne la construit
      # sans commande explicite. Elle est pourtant la preuve que ce que maxx
      # écrit compile encore.
      - name: Compilation de la démo
        working-directory: demo
        run: cargo check
