# What this CI proves, and what it does not.
#
# It proves that maxx compiles and that its suite passes. Nothing in maxx is
# macOS-specific, but it is written on a Mac, and one line such as
# `std::os::unix::process::CommandExt` is enough to break Windows without
# anyone seeing it.
#
# It does not prove that the interface is usable. No test opens a window — they
# cover the model, the parser, the templates and the settings. A human has to
# launch maxx once per system.
#
# What it costs. On a public repository the standard runners are free and
# unlimited: the three systems therefore run on every push, and the net finally
# serves every time it could catch something.
#
# While the repository was private this was not tenable — minutes there are
# counted with multipliers, ×1 on Linux, ×2 on Windows and ×10 on macOS, so
# that a single cold full run cost close to 400 billed minutes out of a monthly
# quota of 2,000. Hence the rationing that came before, which no longer has a
# reason to exist. Should the repository go private again, it would have to
# come back.
#
# Still true: a push that touches only documentation runs nothing.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore"]
  workflow_dispatch:
  schedule:
    # Kept even though every push checks everything: it catches what breaks
    # without anything having changed — a runner update, a tool that moves.
    - cron: "0 6 * * 1"

# A push that replaces another cancels the earlier one: on a branch where you
# push several times in a row, that is where the real gain is. Never on `main`,
# so as not to lose a result someone is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # gpui draws with Vulkan on Linux and speaks Wayland as well as X11; its
      # font crates want fontconfig. Without these packages the build fails on
      # missing C headers, not on Rust.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libvulkan-dev \
            pkg-config \
            cmake \
            clang

      # Defender inspects every file the compiler writes, and rustc writes tens
      # of thousands of them. It is the first cause of slowness on Windows
      # runners, and one exclusion brings it down.
      - name: Keep Defender out of the build directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\\.cargo"
          Add-MpPreference -ExclusionProcess "rustc.exe"
          Add-MpPreference -ExclusionProcess "cargo.exe"
          Add-MpPreference -ExclusionProcess "link.exe"

      - uses: Swatinem/rust-cache@v2

      # No separate `cargo check`: clippy does the same work. Measured on the
      # first Windows run, `check` then `clippy` cost 18 min 16 s — clippy paid
      # nothing because check had prepared everything. Removing it therefore
      # gains almost nothing: it is `cargo test` that costs, because it has to
      # produce machine code where the other two stop at metadata.
      #
      # Compiles nothing: this is the cheapest check of them all, and it keeps a
      # contributor's `cargo fmt` from drowning their real change in a
      # whole-file reformat.
      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The `ci` profile: dependencies at O0 and no debug information. The CI
      # opens no window, so it has nothing to gain from optimising 750 crates,
      # and nobody sets a breakpoint in it.
      - name: Tests
        run: cargo test --profile ci

  demo:
    name: the demo compiles
    runs-on: macos-latest
    # The touched-file filter was removed: `github.event.commits.*.modified` is
    # an array of arrays, and the `join` over it does not give what you would
    # think — the demo was skipped on a push that did modify src/scaffold.rs. A
    # job that skips itself when it should run is worse than a job that runs
    # for nothing, especially at two minutes with the cache.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo
      # The demo is not a workspace member: nothing builds it without an
      # explicit command. It is nonetheless the proof that what maxx writes
      # still compiles.
      - name: Build the demo
        working-directory: demo
        run: cargo check

  generated:
    name: what maxx writes compiles
    # Not on every push: unlike the rest of this file, this job compiles a
    # project maxx wrote, which means the ~750 crates of gpui and
    # gpui-component from scratch the first time. On the Monday cron and on
    # demand, therefore — and by hand after touching a template, which is what
    # the `#[ignore]` attributes are for in the first place.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The generated projects do not compile into `target/`: `create_project`
      # writes `build.target-dir` into their `.cargo/config.toml`, pointing at
      # `run::shared_target_dir()` — one cache for all of them, which is what
      # makes the second project cheap. `rust-cache` knows nothing about that
      # path, so it is cached here.
      #
      # The key carries the compiler as well as the `Cargo.toml` the scaffold
      # writes, and it has to: `stable` moves every six weeks, and a key naming
      # only `scaffold.rs` would still hit exactly on the morning rustc changes.
      # `actions/cache` skips the save on an exact hit, so the tree restored
      # would be one cargo rejects, rebuilt in full and never written back —
      # every Monday, silently, with the stale artefacts kept for ever.
      - name: Cache what the generated projects compile into
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/maxx/target
          key: generated-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('src/scaffold.rs') }}
          restore-keys: generated-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-

      # The five tests `cargo test` never runs. They are the only proof that
      # what maxx writes still compiles as a whole — `examples/shapes.rs` shows
      # each brick compiles on its own, these show the wiring: `main.rs`, the
      # `mod.rs`, the settings module, the palette, the component library.
      #
      # Nothing in compiling maxx checks the method names its catalogue writes
      # into a project, and three defects of that class have already lived
      # there.
      - name: The tests that build whole projects
        run: cargo test --profile ci -- --ignored
