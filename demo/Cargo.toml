# Its own workspace root: the demo is an ordinary project, not a member of
# maxx. `cargo check` at the repository root therefore does not compile it, and
# it builds on its own, exactly like a project you would have generated.
[workspace]

[package]
name = "maxx_demo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# `runtime_shaders` compiles the Metal shaders at startup rather than at build
# time: Xcode 26 ships the Metal toolchain as a separate component, and without
# this feature the build fails on a `metal` tool it cannot find.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json_lenient = "0.2"

[profile.dev.package."*"]
opt-level = 2
