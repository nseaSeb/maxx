# Sa propre racine d'espace de travail : la démo est un projet ordinaire, pas
# un membre de maxx. `cargo check` à la racine du dépôt ne la compile donc pas,
# et elle se construit seule, exactement comme un projet que vous auriez généré.
[workspace]

[package]
name = "maxx_demo"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# `runtime_shaders` compile les shaders Metal au lancement plutôt qu'à la
# compilation : Xcode 26 livre le toolchain Metal en composant séparé, et sans
# cette feature le build échoue sur un outil `metal` introuvable.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"

[profile.dev.package."*"]
opt-level = 2
